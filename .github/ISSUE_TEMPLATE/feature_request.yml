name: Feature request
description: Ask for a new example or a change, such as Terraform or a multi-resource Pulumi project.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need to deploy
      description: Name the DataRobot resource, such as a Workload or a Custom Application, and the tool, such as Pulumi or Terraform.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why the current examples don't cover it
    validations:
      required: true
